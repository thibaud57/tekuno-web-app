<div class="section-divider mt-4 flex items-center gap-4">
    <div class="h-px flex-1 bg-gray-300"></div>
    <h3 class="text-lg font-medium">{{ TRANSLATION_PREFIX + 'title' | transloco }}</h3>
    <div class="h-px flex-1 bg-gray-300"></div>
</div>

<form [formGroup]="form" class="flex flex-col gap-4">
    <mat-form-field class="w-full">
        <mat-label>{{ TRANSLATION_PREFIX + 'fields.name' | transloco }}</mat-label>
        <input matInput [formControl]="form.controls.name" />
    </mat-form-field>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-12">
        <mat-form-field class="col-span-8">
            <mat-label>{{ TRANSLATION_PREFIX + 'fields.iban' | transloco }}</mat-label>
            <input matInput [formControl]="form.controls.iban" />
        </mat-form-field>

        <mat-form-field class="col-span-4">
            <mat-label>{{ TRANSLATION_PREFIX + 'fields.bic' | transloco }}</mat-label>
            <input matInput [formControl]="form.controls.bic" />
        </mat-form-field>
    </div>

    <mat-form-field class="w-full">
        <mat-label>{{ TRANSLATION_PREFIX + 'fields.paypal' | transloco }}</mat-label>
        <input matInput [formControl]="form.controls.paypal" />
    </mat-form-field>
</form>
